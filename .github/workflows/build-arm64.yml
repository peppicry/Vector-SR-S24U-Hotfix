name: Build arm64-only Vector-SR hotfix candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this patch repository
        uses: actions/checkout@v6
        with:
          path: patch-repo

      - name: Checkout pinned Vector-SR
        uses: actions/checkout@v6
        with:
          repository: byemaxx/Vector-SR
          ref: ccf240320c838ee097b7bd4d996f314d25643cb0
          submodules: recursive
          fetch-depth: 0
          path: vector

      - name: Checkout LSPlant build submodules
        run: git -C vector/external/lsplant submodule update --init --recursive lsplant/src/main/jni/external/dex_builder

      - name: Verify pinned build identity
        working-directory: vector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ccf240320c838ee097b7bd4d996f314d25643cb0'
          test "$(git rev-list --count HEAD)" = '3151'
          test "$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)" = 'v1.2'
          # Upstream Gradle reads origin/master for versionCode; freeze it to this checkout.
          git update-ref refs/remotes/origin/master "$(git rev-parse HEAD)"

      - name: Run upstream host regressions
        working-directory: vector
        run: |
          bash tests/run-native-regressions.sh
          bash tests/run-daemon-regressions.sh

      - name: Apply hotfix and arm64 build filter
        working-directory: vector
        run: |
          python3 ../patch-repo/scripts/apply_samsung_hotfix.py
          python3 ../patch-repo/scripts/apply_upgrade_fix.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build.gradle.kts')
          text = root.read_text()
          old = 'ndk { abiFilters.addAll(listOf("arm64-v8a", "armeabi-v7a", "x86", "x86_64")) }'
          new = 'ndk { abiFilters.add("arm64-v8a") }'
          if old not in text:
              raise SystemExit('ABI filter anchor not found')
          root.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Gradle
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.12.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Remove Android SDK bundled CMake
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Build arm64 release
        working-directory: vector
        run: ./gradlew :zygisk:zipRelease

      - name: Prepare installable ZIP
        run: |
          mkdir -p out
          src='vector/zygisk/release/Vector-SR-v1.2-3151-Release.zip'
          cp "$src" out/Vector-SR-v1.2-3151-S24U-Arm64-SharedUID-Hotfix-Candidate-Release.zip
          sha256sum out/Vector-SR-v1.2-3151-S24U-Arm64-SharedUID-Hotfix-Candidate-Release.zip | tee out/SHA256SUMS.txt

      - name: Upload patched module
        uses: actions/upload-artifact@v6
        with:
          name: Vector-SR-v1.2-3151-S24U-Arm64-SharedUID-Hotfix-Candidate
          path: |
            out/Vector-SR-v1.2-3151-S24U-Arm64-SharedUID-Hotfix-Candidate-Release.zip
            out/SHA256SUMS.txt
          if-no-files-found: error
