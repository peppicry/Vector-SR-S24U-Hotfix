name: Build device-tested Vector-SR hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-device-tested.yml'
      - 'scripts/apply_samsung_hotfix.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this patch repository
        uses: actions/checkout@v6
        with:
          path: patch-repo

      - name: Checkout pinned Vector-SR
        uses: actions/checkout@v6
        with:
          repository: byemaxx/Vector-SR
          ref: a8f500ddb1c8f53efec6fd02b6520c321db34627
          submodules: recursive
          fetch-depth: 0
          path: vector

      - name: Checkout LSPlant build submodules
        run: git -C vector/external/lsplant submodule update --init --recursive lsplant/src/main/jni/external/dex_builder

      - name: Apply Samsung android.uid.system guard
        working-directory: vector
        run: |
          python3 ../patch-repo/scripts/apply_samsung_hotfix.py
          git diff --check
          git diff -- legacy/src/main/java/org/matrix/vector/legacy/LegacyDelegateImpl.java legacy/src/main/java/de/robv/android/xposed/XposedBridge.java

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Gradle
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.12.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove Android SDK bundled CMake
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Build Vector-SR
        working-directory: vector
        run: ./gradlew zipAll

      - name: Prepare installable ZIP
        run: |
          mkdir -p out
          src=$(ls vector/zygisk/release/Vector-SR-v*-Release.zip | head -1)
          cp "$src" out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip
          sha256sum out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip | tee out/SHA256SUMS.txt
          unzip -p out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip module.prop 2>/dev/null || true

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vector-SR-S24U-Device-Tested-SharedUID-Hotfix
          path: |
            out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2-3136-s24u-hotfix"
          TITLE="Vector-SR v1.2 (3136) — S24 Ultra SharedUID Hotfix"
          NOTES=$(cat <<'EOF'
          Device-specific Vector-SR build for the Samsung Galaxy S24 Ultra baseline documented in this private repository.

          Fix: targeted legacy-hook guard for Samsung's `getApplicationInfoAsUser("android.uid.system", ...)` probe that previously caused a VectorLegacyBridge log/exception storm after soft restart.

          The release contains the installable KernelSU/Vector-SR ZIP and `SHA256SUMS.txt`. The source patch and reproducible build workflow remain in the repository.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip \
              out/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              out/Vector-SR-S24U-Device-Tested-SharedUID-Hotfix-Release.zip \
              out/SHA256SUMS.txt \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}"
          fi
