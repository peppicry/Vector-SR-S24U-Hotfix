name: Build candidate Vector-SR S24U hotfix

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish this candidate as a separate GitHub prerelease
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-device-tested.yml'
      - 'scripts/apply_samsung_hotfix.py'
      - 'docs/BUILDING.md'
      - 'release-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this compatibility repository
        uses: actions/checkout@v6
        with:
          path: patch-repo

      - name: Checkout pinned Vector-SR
        uses: actions/checkout@v6
        with:
          repository: byemaxx/Vector-SR
          ref: ccf240320c838ee097b7bd4d996f314d25643cb0
          submodules: recursive
          fetch-depth: 0
          path: vector

      - name: Checkout LSPlant build submodules
        run: git -C vector/external/lsplant submodule update --init --recursive lsplant/src/main/jni/external/dex_builder

      - name: Verify pinned build identity
        working-directory: vector
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ccf240320c838ee097b7bd4d996f314d25643cb0'
          test "$(git rev-list --count HEAD)" = '3151'
          test "$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)" = 'v1.2'
          # Upstream Gradle reads origin/master for versionCode; freeze it to this checkout.
          git update-ref refs/remotes/origin/master "$(git rev-parse HEAD)"

      - name: Run upstream host regressions
        working-directory: vector
        run: |
          bash tests/run-native-regressions.sh
          bash tests/run-daemon-regressions.sh

      - name: Apply Samsung android.uid.system guard
        working-directory: vector
        run: |
          python3 ../patch-repo/scripts/apply_samsung_hotfix.py
          python3 ../patch-repo/scripts/apply_upgrade_fix.py
          git diff --check
          git diff -- legacy/src/main/java/org/matrix/vector/legacy/LegacyDelegateImpl.java legacy/src/main/java/de/robv/android/xposed/XposedBridge.java

      - name: Verify GPL-3.0 license and record source identity
        shell: bash
        run: |
          set -euo pipefail
          cmp vector/LICENSE patch-repo/LICENSE
          echo "PUBLIC_REPO_SHA=$(git -C patch-repo rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Package corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          SOURCE_DIR="$RUNNER_TEMP/vector-sr-s24u-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          rsync -a \
            --exclude='.git' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='.cxx' \
            vector/ "$SOURCE_DIR/"

          mkdir -p "$SOURCE_DIR/s24u-hotfix-build"
          cp patch-repo/scripts/apply_samsung_hotfix.py "$SOURCE_DIR/s24u-hotfix-build/"
          cp patch-repo/docs/BUILDING.md "$SOURCE_DIR/s24u-hotfix-build/BUILDING.md"
          mkdir -p "$SOURCE_DIR/s24u-hotfix-build/scripts" "$SOURCE_DIR/s24u-hotfix-build/docs" "$SOURCE_DIR/s24u-hotfix-build/tests"
          cp patch-repo/scripts/apply_upgrade_fix.py patch-repo/scripts/package_upgrade_release.py "$SOURCE_DIR/s24u-hotfix-build/scripts/"
          cp -r patch-repo/module-overrides "$SOURCE_DIR/s24u-hotfix-build/"
          cp patch-repo/docs/BUILDING.md patch-repo/docs/RELEASE_3151_R2.md "$SOURCE_DIR/s24u-hotfix-build/docs/"
          cp patch-repo/tests/test_upgrade_runtime.py "$SOURCE_DIR/s24u-hotfix-build/tests/"
          git -C vector submodule status --recursive > out/SUBMODULES.txt
          cp out/SUBMODULES.txt "$SOURCE_DIR/s24u-hotfix-build/"

          (
            cd "$SOURCE_DIR"
            zip -qr "$GITHUB_WORKSPACE/out/Vector-SR-v1.2-3151-S24U-Hotfix-source.zip" .
          )

          git -C vector diff --binary > out/Vector-SR-v1.2-3151-S24U-Hotfix.patch
          cat > out/SOURCE-METADATA.txt <<EOF
          Project: unofficial Vector-SR Samsung S24 Ultra Shared-UID hotfix
          Hotfix originally modified: 2026-08-22
          Upstream rebase: 2026-10-24
          Vector-SR upstream: byemaxx/Vector-SR
          Upstream commit: ccf240320c838ee097b7bd4d996f314d25643cb0
          Module version: v1.2 (3151)
          Validation: candidate; not device-tested
          Compatibility repository commit: ${PUBLIC_REPO_SHA}
          License: GNU General Public License v3.0 (GPL-3.0)
          The source ZIP contains the patched upstream working tree and checked-out submodule contents used for this build.
          Build instructions and the exact patch script are included in s24u-hotfix-build/ inside the source ZIP.
          SUBMODULES.txt records the checked-out submodule revisions.
          EOF

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Gradle
        run: |
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.12.1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Remove Android SDK bundled CMake
        run: rm -rf "$ANDROID_HOME/cmake"

      - name: Build Vector-SR
        working-directory: vector
        run: ./gradlew zipAll

      - name: Prepare installable ZIP and checksums
        shell: bash
        run: |
          set -euo pipefail
          src='vector/zygisk/release/Vector-SR-v1.2-3151-Release.zip'
          cp "$src" out/Vector-SR-v1.2-3151-S24U-SharedUID-Hotfix-Candidate-Release.zip
          (
            cd out
            rm -f SHA256SUMS.txt
            for file in *; do
              [ "$file" = 'SHA256SUMS.txt' ] && continue
              sha256sum "$file"
            done | sort > SHA256SUMS.txt
          )
          unzip -p out/Vector-SR-v1.2-3151-S24U-SharedUID-Hotfix-Candidate-Release.zip module.prop

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Vector-SR-v1.2-3151-S24U-SharedUID-Hotfix-Candidate
          path: out/*
          if-no-files-found: error

      - name: Publish separate candidate prerelease
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.2-3151-s24u-hotfix'
          TITLE='Vector-SR v1.2 (3151) — S24 Ultra SharedUID Hotfix candidate'
          NOTES=$(cat <<'EOF'
          Unofficial candidate rebased to byemaxx/Vector-SR commit ccf240320c838ee097b7bd4d996f314d25643cb0 (v1.2 / 3151).

          This rebase has not been validated on a device. Host regressions and a successful build do not establish soft-restart, thermal, or One UI compatibility on hardware.

          The historical One UI 8.5 release remains available separately at:
          https://github.com/peppicry/Vector-SR-S24U-Hotfix/releases/tag/v1.2-3136-s24u-hotfix

          This release is not affiliated with or endorsed by byemaxx/Vector-SR, JingMatrix/Vector, Samsung, or their upstream developers.

          Fix:
          - targeted legacy-hook guard for Samsung's `getApplicationInfoAsUser("android.uid.system", ...)` probe that previously caused a VectorLegacyBridge log/exception storm after soft restart;
          - narrow logging safety net for the exact matching NameNotFoundException.

          Licensing and source:
          - Vector-SR upstream is GPL-3.0 and this modified distribution remains GPL-3.0;
          - the complete corresponding patched source used for the build is attached as a source ZIP, including checked-out submodule contents;
          - the exact source diff and SOURCE-METADATA.txt are attached;
          - SHA256SUMS.txt covers all release assets.

          Historical device validation applies to the 3136 baseline. Please report modification-specific issues here rather than upstream unless reproduced on an unmodified build.
          EOF
          )

          # Refuse to move an existing tag or replace an existing release's assets.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to replace it." >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$TAG" out/* \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$PUBLIC_REPO_SHA" \
            --prerelease \
            --latest=false \
            --repo "$GITHUB_REPOSITORY"
