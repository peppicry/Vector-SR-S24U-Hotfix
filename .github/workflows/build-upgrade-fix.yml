name: Package and release 3151 automatic upgrade fix

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish a new packaging prerelease; never replace an existing release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-upgrade-fix.yml'
      - 'module-overrides/**'
      - 'scripts/apply_upgrade_fix.py'
      - 'scripts/package_upgrade_release.py'
      - 'tests/test_upgrade_runtime.py'

permissions:
  contents: write

concurrency:
  group: vector-3151-upgrade-fix-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Read the packaging revision
        run: |
          revision=$(python3 -c "import runpy; print(runpy.run_path('scripts/apply_upgrade_fix.py')['PACKAGING_REVISION'])")
          printf 'VECTOR_REVISION=%s\nVECTOR_MODULE=%s\n' "$revision" \
            "Vector-SR-v1.2-3151-${revision}-S24U-SharedUID-Hotfix-Release.zip" >> "$GITHUB_ENV"

      - name: Install BusyBox for ash integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox

      - name: Download the immutable verified binary and source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh release download v1.2-3151-s24u-hotfix --repo "$GITHUB_REPOSITORY" --dir base \
            --pattern 'Vector-SR-v1.2-3151-S24U-SharedUID-Hotfix-Candidate-Release.zip' \
            --pattern 'Vector-SR-v1.2-3151-S24U-Hotfix-source.zip' \
            --pattern 'Vector-SR-v1.2-3151-S24U-Hotfix.patch' \
            --pattern 'SUBMODULES.txt'

      - name: Build the corrected ZIP without changing signed binaries
        run: python3 scripts/package_upgrade_release.py --base-dir base --output out --repository-commit "$GITHUB_SHA"

      - name: Test the complete installer and service under dash and BusyBox ash
        run: |
          python3 tests/test_upgrade_runtime.py --shell /bin/sh --module-zip "out/$VECTOR_MODULE" --report dash-report.json
          python3 tests/test_upgrade_runtime.py --shell 'busybox ash' --module-zip "out/$VECTOR_MODULE" --report ash-report.json

      - name: Package the passing test reports and verify release checksums
        run: |
          python3 scripts/package_upgrade_release.py --base-dir base --output out --repository-commit "$GITHUB_SHA" --test-report dash-report.json --test-report ash-report.json
          cd out
          sha256sum --check SHA256SUMS.txt

      - name: Save reviewed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Vector-SR-3151-${{ env.VECTOR_REVISION }}-${{ github.sha }}
          path: out/*
          if-no-files-found: error

      - name: Publish a new packaging prerelease (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2-3151-s24u-hotfix-$VECTOR_REVISION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [ -n "$existing" ]; then
            echo "Tag $TAG already exists; choose a new packaging revision. Nothing was replaced." >&2
            exit 1
          fi
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Vector-SR v1.2 (3151-$VECTOR_REVISION) — startup diagnostics" \
            --notes-file "docs/RELEASE_3151_${VECTOR_REVISION^^}.md" --draft --prerelease --latest=false
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
